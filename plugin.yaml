name: usb-smart-dashboard
version: 0.3.0
description: "Renders live system stats and Hermes agent status on a USB smart display. Runs via plugin hooks and a background render thread — no agent action required."
author: "@LVT382009"
repository: "https://github.com/sademardotDE/usb-smart-dashboard"
homepage: "https://github.com/sademardotDE/usb-smart-dashboard"
provides_tools:
  - usb_display_message
provides_hooks:
  - on_session_start
  - on_session_end
  - post_tool_call
  - on_stream_start
  - on_stream_end
hooks:
  - on_session_start
  - on_session_end
  - post_tool_call
  - on_stream_start
  - on_stream_end

config_schema:
  enabled:
    type: boolean
    default: true
    description: "Master-Schalter für den Display-Treiber"
  driver:
    type: select
    default: "turing"
    options: ["turing", "serial", "file", "auto"]
    description: "Display-Treiber-Backend"
  port:
    type: string
    default: ""
    description: "Serieller Port (z. B. /dev/ttyACM0), leer = Autodetect"
  baudrate:
    type: number
    default: 115200
    description: "Serielle Baudrate"
  brightness:
    type: number
    default: 25
    minimum: 0
    maximum: 100
    description: "Hintergrundbeleuchtung (0-100)"
  display_width:
    type: number
    default: 480
    description: "Panel-Breite in Pixel (Landscape)"
  display_height:
    type: number
    default: 320
    description: "Panel-Höhe in Pixel (Landscape)"
  font_size:
    type: number
    default: 28
    description: "Schriftgröße für Textzeilen"

lifecycle:
  hooks:
    pre_install: "hooks/pre_install.py"
    post_install: "hooks/post_install.py"
    pre_uninstall: "hooks/pre_uninstall.py"
    post_uninstall: "hooks/post_uninstall.py"
  requires_root: false
  systemd_services:
    - "usb-smart-dashboard.service"
  udev_rules:
    - "99-usb-smart-dashboard.rules"